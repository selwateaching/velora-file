<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File d'attente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1EDE3;
    --paper: #FBFAF6;
    --ink: #1C2B39;
    --navy: #16324F;
    --navy-light: #24486E;
    --amber: #D98E04;
    --amber-light: #F2B33D;
    --slate: #5B6B7C;
    --line: #D8D2C2;
    --success: #2F7A4F;
    --danger: #A5432E;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  .num{ font-family: 'Archivo Expanded', sans-serif; }

  /* ---------- App shell ---------- */
  .app{ display:flex; flex-direction:column; min-height:100vh; }

  .switcher-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 18px;
    background: var(--paper);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
    font-size:14px; color:var(--slate);
  }
  .brand strong{ color:var(--navy); font-weight:600; }
  .switcher{
    display:flex; gap:2px;
    background: var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:2px;
  }
  .switcher button{
    border:none; background:transparent; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:500;
    color: var(--slate);
    padding:7px 12px;
    border-radius:6px;
    transition: background .15s, color .15s;
  }
  .switcher button.active{
    background: var(--navy);
    color: #fff;
  }
  .conn-status{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color: var(--slate);
  }
  .conn-dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--danger);
  }
  .conn-dot.ok{ background: var(--success); }

  .view{ flex:1; padding: 28px; }

  /* ---------- ÉCRAN (display) ---------- */
  .ecran{
    background: var(--navy);
    color: #fff;
    border-radius: 14px;
    min-height: calc(100vh - 90px);
    padding: 36px 44px;
    display:flex; flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .ecran::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 85% -10%, rgba(217,142,4,0.18), transparent 55%);
    pointer-events:none;
  }
  .ecran-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    border-bottom: 1px solid rgba(255,255,255,0.18);
    padding-bottom:18px;
    margin-bottom: 30px;
  }
  .ecran-lieu{ font-size: 20px; font-weight: 600; letter-spacing:.2px; }
  .ecran-clock{ font-size: 20px; color: rgba(255,255,255,0.75); font-variant-numeric: tabular-nums; }

  .ecran-main{
    flex:1;
    display:flex;
    gap: 48px;
    align-items:center;
  }
  .ecran-current{
    flex: 1.3;
    text-align:center;
  }
  .ecran-current-label{
    font-size: 15px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 6px;
  }
  .ecran-current-name{
    font-size: clamp(48px, 9vw, 110px);
    font-weight: 800;
    line-height: 1.08;
    color: var(--amber-light);
    transition: transform .25s ease;
    word-break: break-word;
  }
  .ecran-current-name.flash{ animation: flashTicket .7s ease; }
  .ecran-current-cat{
    font-size: 20px;
    color: rgba(255,255,255,0.65);
    margin-top: 8px;
  }
  @keyframes flashTicket{
    0%{ transform: scale(0.85); opacity:0; }
    55%{ transform: scale(1.04); opacity:1; }
    100%{ transform: scale(1); }
  }
  .ecran-current-guichet{
    font-size: 26px;
    margin-top: 10px;
    color: #fff;
  }
  .ecran-empty{
    font-size: 22px;
    color: rgba(255,255,255,0.5);
  }

  .ecran-side{
    flex:1;
    display:flex; flex-direction:column; gap:22px;
  }
  .ecran-panel-title{
    font-size:13px;
    color: rgba(255,255,255,0.55);
    margin-bottom:10px;
  }
  .guichet-rows{ display:flex; flex-direction:column; gap:8px; }
  .guichet-row{
    display:flex; justify-content:space-between; align-items:center;
    background: rgba(255,255,255,0.06);
    border-radius:8px;
    padding:10px 14px;
  }
  .guichet-row .name{ font-size:15px; color: rgba(255,255,255,0.8); }
  .guichet-row .ticket{
    font-size:16px; font-weight:700;
    max-width: 55%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .guichet-row .ticket.idle{ color: rgba(255,255,255,0.35); font-weight:500; font-size:14px; }

  .waiting-list{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .waiting-chip{
    font-size:15px; font-weight:600;
    background: rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px;
    padding:6px 12px;
    max-width: 200px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .waiting-count{
    font-size:15px; color: rgba(255,255,255,0.55); margin-top:6px;
  }

  /* ---------- SECRÉTAIRE (accueil + cabines) ---------- */
  .agent{ max-width: 720px; margin: 0 auto; }
  .card{
    background: var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding: 22px 24px;
    margin-bottom: 18px;
  }
  .card h2{
    margin:0 0 14px 0;
    font-size:16px;
    color: var(--navy);
    font-weight:600;
  }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    font-family:inherit; font-size:15px; font-weight:600;
    border:none; border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    transition: opacity .15s;
  }
  .btn:hover{ opacity:.9; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background: var(--navy); color:#fff; }
  .btn-success{ background: var(--success); color:#fff; }
  .btn-quiet{ background: transparent; color: var(--navy); border:1px solid var(--line); }
  .queue-preview{ font-size:14px; color: var(--slate); margin-top:8px; }
  .sub-inline{ color: var(--slate); font-size:14px; margin: 0 0 14px 0; }

  .cabine-row{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--bg);
    border-radius:10px;
    padding: 14px 18px;
    margin-bottom: 10px;
  }
  .cabine-name{ font-size:15px; font-weight:600; color: var(--ink); }
  .cabine-status{ font-size:13px; margin-top:3px; }
  .cabine-status.occupied{ color: var(--amber); font-weight:600; }
  .cabine-status.free{ color: var(--slate); }

  .settings-toggle{
    background:none; border:none; color:var(--slate);
    font-size:13px; cursor:pointer; text-decoration:underline;
    padding:0; margin-top:4px;
  }
  .settings-block{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .row-line{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .row-line input{
    font-family:inherit; font-size:14px;
    border:1px solid var(--line); border-radius:6px;
    padding:8px 10px; background:#fff; color:var(--ink);
  }
  .remove-x{
    background:none; border:none; color:var(--danger);
    cursor:pointer;
